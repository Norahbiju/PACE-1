name: Deploy EC2

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy through SSM
        id: deploy
        run: |
          set -euo pipefail
          INSTANCE_ID="${{ vars.EC2_INSTANCE_ID }}"

          if [ -z "$INSTANCE_ID" ]; then
            INSTANCE_ID=$(aws ec2 describe-instances \
              --filters "Name=tag:Name,Values=pace-profile-app" "Name=instance-state-name,Values=pending,running,stopping,stopped" \
              --query "Reservations[].Instances[].InstanceId | [0]" \
              --output text)
          fi

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "EC2 instance ID was not provided and no instance tagged Name=pace-profile-app was found."
            echo "Add Terraform output ec2_instance_id as GitHub variable EC2_INSTANCE_ID, or confirm the EC2 tag exists."
            exit 1
          fi

          echo "Deploying to $INSTANCE_ID"

          cat > ssm-parameters.json <<'JSON'
          {
            "commands": [
              "set -euo pipefail",
              "cd /opt/pace-profile",
              "git pull",
              "cd app",
              "if [ ! -f /swapfile ]; then sudo fallocate -l 2G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile; fi",
              "sudo swapon /swapfile || true",
              "npm install",
              "npm run build",
              "sudo tee /etc/systemd/system/pace-profile.service >/dev/null <<'SERVICE'",
              "[Unit]",
              "Description=PACE PROFILE Next.js application",
              "After=network.target",
              "",
              "[Service]",
              "Type=simple",
              "WorkingDirectory=/opt/pace-profile/app",
              "Environment=NODE_ENV=production",
              "Environment=PORT=3000",
              "ExecStart=/usr/bin/npm run start",
              "Restart=always",
              "RestartSec=5",
              "User=root",
              "",
              "[Install]",
              "WantedBy=multi-user.target",
              "SERVICE",
              "sudo tee /etc/nginx/conf.d/pace-profile.conf >/dev/null <<'NGINX'",
              "server {",
              "  listen 80;",
              "",
              "  location / {",
              "    proxy_pass http://127.0.0.1:3000;",
              "    proxy_http_version 1.1;",
              "    proxy_set_header Upgrade $http_upgrade;",
              "    proxy_set_header Connection 'upgrade';",
              "    proxy_set_header Host $host;",
              "    proxy_cache_bypass $http_upgrade;",
              "  }",
              "}",
              "NGINX",
              "sudo rm -f /etc/nginx/conf.d/default.conf",
              "sudo systemctl daemon-reload",
              "sudo systemctl enable pace-profile",
              "sudo systemctl restart pace-profile",
              "sudo systemctl enable nginx",
              "sudo systemctl restart nginx",
              "sudo systemctl status pace-profile --no-pager"
            ]
          }
          JSON

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy PACE PROFILE from GitHub Actions" \
            --parameters file://ssm-parameters.json \
            --query "Command.CommandId" \
            --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          WAIT_STATUS=$?
          set -e
          INVOCATION=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json)
          echo "$INVOCATION"
          STATUS=$(echo "$INVOCATION" | jq -r '.Status')
          if [ "$WAIT_STATUS" -ne 0 ] || [ "$STATUS" != "Success" ]; then
            exit 1
          fi

      - name: Public URL
        run: |
          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "${{ steps.deploy.outputs.instance_id }}" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)
          echo "PACE PROFILE is available at http://$PUBLIC_IP"
