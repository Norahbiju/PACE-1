name: Deploy EC2

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy through SSM
        id: deploy
        run: |
          set -euo pipefail
          cat > ssm-parameters.json <<'JSON'
          {
            "commands": [
              "set -euo pipefail",
              "cd /opt/pace-profile",
              "git pull",
              "cd app",
              "npm install",
              "npm run build",
              "sudo systemctl restart pace-profile",
              "sudo systemctl status pace-profile --no-pager"
            ]
          }
          JSON

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy PACE PROFILE from GitHub Actions" \
            --parameters file://ssm-parameters.json \
            --query "Command.CommandId" \
            --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}"
          WAIT_STATUS=$?
          set -e
          INVOCATION=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json)
          echo "$INVOCATION"
          STATUS=$(echo "$INVOCATION" | jq -r '.Status')
          if [ "$WAIT_STATUS" -ne 0 ] || [ "$STATUS" != "Success" ]; then
            exit 1
          fi

      - name: Public URL
        run: |
          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)
          echo "PACE PROFILE is available at http://$PUBLIC_IP"
