name: Terraform

on:
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init

      - name: Terraform plan
        if: inputs.action == 'plan'
        run: terraform plan -var="aws_region=${{ vars.AWS_REGION || secrets.AWS_REGION }}" -var="ec2_key_name=${{ vars.EC2_KEY_NAME }}" -var="allowed_ssh_cidr=${{ vars.ALLOWED_SSH_CIDR || '0.0.0.0/0' }}"

      - name: Terraform apply
        if: inputs.action == 'apply'
        run: terraform apply -auto-approve -var="aws_region=${{ vars.AWS_REGION || secrets.AWS_REGION }}" -var="ec2_key_name=${{ vars.EC2_KEY_NAME }}" -var="allowed_ssh_cidr=${{ vars.ALLOWED_SSH_CIDR || '0.0.0.0/0' }}"

      - name: Terraform destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -auto-approve -var="aws_region=${{ vars.AWS_REGION || secrets.AWS_REGION }}" -var="ec2_key_name=${{ vars.EC2_KEY_NAME }}" -var="allowed_ssh_cidr=${{ vars.ALLOWED_SSH_CIDR || '0.0.0.0/0' }}"

      - name: Outputs
        if: inputs.action == 'apply'
        run: terraform output
