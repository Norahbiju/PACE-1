name: Terraform

on:
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init

      - name: Terraform plan
        if: inputs.action == 'plan'
        run: terraform plan -var="aws_region=${{ vars.AWS_REGION }}"

      - name: Terraform apply
        if: inputs.action == 'apply'
        run: terraform apply -auto-approve -var="aws_region=${{ vars.AWS_REGION }}"

      - name: Terraform destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -auto-approve -var="aws_region=${{ vars.AWS_REGION }}"

      - name: Outputs
        if: inputs.action == 'apply'
        run: terraform output
